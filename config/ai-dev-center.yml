version: 1

ai:
  provider: openrouter

  model: deepseek/deepseek-v4-pro

  endpoint: https://openrouter.ai/api/v1

  authentication:
    type: secret_reference
    secret: openrouter-api

  timeout_seconds: 30

  discovery:
    enabled: true
    require_json: true
    max_requirements: 50

  council:
    enabled: true
    max_variants_per_agent: 3

    agents:
      environment_architect:
        provider: openrouter
        model: deepseek/deepseek-v4-pro
        timeout_seconds: 60
        temperature: 0.7

      toolchain_integrator:
        provider: openrouter
        model: google/gemini-2.5-flash
        timeout_seconds: 60
        temperature: 0.7

      risk_assessor:
        provider: openrouter
        model: openai/gpt-4o
        timeout_seconds: 60
        temperature: 0.7

      chairman:
        provider: openrouter
        model: anthropic/claude-sonnet-4.5
        timeout_seconds: 90
        temperature: 0.2

    ollama_url: http://localhost:11434
