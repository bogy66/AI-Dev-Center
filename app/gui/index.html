<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>AI Dev Center</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #1e1e1e;
        color: #ddd;
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
    }

    .sidebar {
        width: 260px;
        background: #111;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
    }

    .sidebar h2 {
        margin: 0 0 20px 0;
        font-size: 24px;
    }

    .sidebar button {
        margin-bottom: 10px;
        width: 100%;
    }

    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    .main-header {
        background: #111;
        padding: 20px;
        font-size: 24px;
        font-weight: bold;
    }

    .chat-area {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
    }

    .chat-message {
        background: #2b2b2b;
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 10px;
    }

    .chat-input {
        display: flex;
        padding: 20px;
        background: #111;
    }

    .chat-input textarea {
        flex: 1;
        margin-right: 10px;
    }

    .chat-input button {
        width: 100px;
    }

    .right-sidebar {
        width: 300px;
        background: #111;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
    }

    .right-sidebar h2 {
        margin: 0 0 20px 0;
        font-size: 24px;
    }

    .status-indicator {
        margin-bottom: 10px;
        padding: 10px;
        background: #2b2b2b;
        border-radius: 5px;
    }

    .approval-section {
        margin-top: 20px;
    }

    .approval-section textarea {
        margin-bottom: 10px;
    }
</style>

</head>


<body>
    <div class="sidebar">
        <div>
            <h2>🤖 AI Dev Center</h2>
            <button>+ Neues Projekt</button>
            <div id="project-list">
                <div class="project active">NeuesKIProjekt</div>
                <!-- Add more projects here -->
            </div>
        </div>
        <div>
            <button>Einstellungen</button>
        </div>
    </div>

    <div class="main">
        <div class="main-header">Aktives Projekt: NeuesKIProjekt</div>
        <div class="chat-area" id="chat-area">
            <div class="chat-message">Füge YouTube als Datenquelle hinzu</div>
            <div class="chat-message" id="result">Bereit...</div>
        </div>
        <div class="chat-input">
            <textarea id="task" placeholder="Neue Aufgabe..."></textarea>
            <button onclick="runAI()">Senden</button>
        </div>
    </div>

    <div class="right-sidebar">
        <h2>Workflow</h2>
        <div class="status-indicator">👨‍💼 Projektmanager</div>
        <div class="status-indicator">🏗 Architekt</div>
        <div class="status-indicator">💻 Entwickler</div>
        <div class="status-indicator">🧪 Tester</div>
        <div class="status-indicator">🔍 Reviewer</div>

        <div class="approval-section">
            <h2>Udo Freigabe</h2>
            <div id="approval-status">Lade Status...</div>
            <textarea id="approval-comment" placeholder="Kommentar"></textarea>
            <button id="approve-button" onclick="approve()">✅ FREIGEBEN</button>
            <button id="reject-button" onclick="reject()">❌ ABLEHNEN</button>
        </div>
    </div>


<script>
document.getElementById("result").innerHTML = "⏳ KI-Team arbeitet...";

let project = document.getElementById("project").value;

let task = document.getElementById("task").value;

let response = await fetch("/run", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        project: project,
        task: task
    })
});

let data = await response.json();

let html = "";

for (let agent in data) {
    html += `
    <div class="chat-message">
        <h2>${agent}</h2>
        <hr>
        ${marked.parse(data[agent])}
    </div>
    `;
}

document.getElementById("result").innerHTML = html;


async function fetchApprovalStatus() {
    try {
        let response = await fetch("/approval");
        let data = await response.json();
        updateApprovalUI(data);
    } catch (error) {
        document.getElementById("approval-status").innerText = "Fehler beim Laden des Status";
    }
}

function updateApprovalUI(data) {
    const statusElement = document.getElementById("approval-status");
    const commentElement = document.getElementById("approval-comment");
    const approveButton = document.getElementById("approve-button");
    const rejectButton = document.getElementById("reject-button");

    switch (data.status) {
        case "waiting":
            statusElement.innerText = "WARTET AUF FREIGABE";
            commentElement.style.display = "block";
            approveButton.style.display = "inline-block";
            rejectButton.style.display = "inline-block";
            break;
        case "approved":
            statusElement.innerText = "FREIGEGEBEN";
            commentElement.style.display = "none";
            approveButton.style.display = "none";
            rejectButton.style.display = "none";
            break;
        case "rejected":
            statusElement.innerText = "ABGELEHNT";
            commentElement.style.display = "none";
            approveButton.style.display = "none";
            rejectButton.style.display = "none";
            break;
        default:
            statusElement.innerText = "Unbekannter Status";
    }
}

async function approve() {
    const comment = document.getElementById("approval-comment").value;
    try {
        let response = await fetch("/approval/approve", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                approved_by: "Udo",
                comment: comment
            })
        });
        let data = await response.json();
        updateApprovalUI(data);
    } catch (error) {
        document.getElementById("approval-status").innerText = "Fehler beim Freigeben";
    }
}

async function reject() {
    const comment = document.getElementById("approval-comment").value;
    try {
        let response = await fetch("/approval/reject", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                approved_by: "Udo",
                comment: comment
            })
        });
        let data = await response.json();
        updateApprovalUI(data);
    } catch (error) {
        document.getElementById("approval-status").innerText = "Fehler beim Ablehnen";
    }
}

window.onload = function() {
    fetchApprovalStatus();
};


document.getElementById("result").innerHTML =
"⏳ KI-Team arbeitet...";


let project =
document.getElementById("project").value;


let task =
document.getElementById("task").value;



let response =
await fetch(
"/run",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
project:project,
task:task
})
}
);



let data =
await response.json();



let html="";


for(let agent in data){

html +=
`
<h2>${agent}</h2>
<hr>
${marked.parse(data[agent])}
`;

}



document.getElementById("result").innerHTML =
html;


}


</script>


</body>
</html>
