<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>AI Dev Center</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background:#1e1e1e;
    color:#ddd;
    margin:0;
}

.header {
    background:#111;
    padding:20px;
    font-size:28px;
    font-weight:bold;
}

.container {
    padding:20px;
}

.card {
    background:#2b2b2b;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
}

input, textarea {
    width:100%;
    background:#111;
    color:white;
    border:1px solid #555;
    padding:10px;
    font-size:16px;
}

textarea {
    height:120px;
}

button {
    background:#1976d2;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover {
    background:#2196f3;
}

.agents {
    display:flex;
    gap:10px;
}

.agent {
    background:#333;
    padding:10px;
    border-radius:5px;
    flex:1;
}

.result {
    background:#111;
    padding:20px;
    border-radius:8px;
    white-space:normal;
}

pre {
    background:#000;
    padding:10px;
}

</style>

</head>


<body>

<div class="header">
🤖 AI Dev Center
</div>


<div class="container">


<div class="card">

<h2>Projekt</h2>

<input id="project"
value="/home/udo/NeuesKIProjekt">


<h2>Aufgabe</h2>

<textarea id="task">
Füge YouTube als Datenquelle hinzu
</textarea>


<br><br>

<button onclick="runAI()">
▶ KI Entwicklerteam starten
</button>

</div>


<div class="card">

<h2>Status</h2>

<div class="agents">

<div class="agent">
👨‍💼 Projektmanager
</div>

<div class="agent">
🏗 Architekt
</div>

<div class="agent">
💻 Entwickler
</div>

<div class="agent">
🧪 Tester
</div>

<div class="agent">
🔍 Reviewer
</div>

</div>

</div>


<div class="card">

<h2>Ergebnisse</h2>

<div id="result" class="result">
Bereit...
</div>

</div>


</div>


<script>


async function runAI(){


document.getElementById("result").innerHTML =
"⏳ KI-Team arbeitet...";


let project =
document.getElementById("project").value;


let task =
document.getElementById("task").value;



let response =
await fetch(
"/run",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
project:project,
task:task
})
}
);



let data =
await response.json();



let html="";


for(let agent in data){

html +=
`
<h2>${agent}</h2>
<hr>
${marked.parse(data[agent])}
`;

}



document.getElementById("result").innerHTML =
html;


}


</script>


</body>
</html>
