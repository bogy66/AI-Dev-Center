<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dev Center</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app-container">
    <!-- LEFT COLUMN: Recents -->
    <aside id="recents-panel">
        <div class="panel-header">
            <h2>Recents</h2>
        </div>
        <ul id="recents-list"></ul>
    </aside>

    <!-- RIGHT COLUMN: Main -->
    <main id="main-panel">
        <header id="project-header">
            <div class="brand">
                <span class="brand-mark">AI</span>
                <span class="brand-title">AI Dev Center</span>
            </div>
            <div class="active-project">
                <span class="label">Project</span>
                <strong id="project-name-display">No project selected</strong>
            </div>
            <div class="header-actions">
                <span id="global-status" class="status-indicator">Ready</span>
                <span id="session-info" class="session-info" style="display:none;">
                    Session: <code id="session-id-display"></code>
                    <button id="copy-session-btn" class="copy-button" title="Copy session ID">Copy</button>
                </span>
                <button id="new-project-btn" class="primary-button">+ New Project</button>
            </div>
        </header>

        <!-- Chat area with live status -->
        <section id="chat-panel">
            <div id="chat-messages">
                <div id="empty-chat-state" class="empty-chat">Start a conversation...</div>
            </div>
            <div id="live-status" class="live-status"></div>
        </section>

        <!-- Trace drag handle -->
        <div id="trace-drag-handle" title="Drag to resize Trace"></div>

        <!-- Trace at bottom -->
        <section id="trace-panel">
            <div class="trace-header">
                <div class="trace-title">Trace</div>
                <div class="trace-controls">
                    <select id="trace-filter">
                        <option value="all">All</option>
                        <option value="Agent">Agent</option>
                        <option value="MCP">MCP</option>
                        <option value="Workflow">Workflow</option>
                    </select>
                    <select id="trace-level-select">
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO" selected>INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                    </select>
                    <button id="clear-trace-btn">Clear</button>
                    <button id="copy-all-btn">Copy</button>
                    <button id="export-trace-btn">Export</button>
                </div>
            </div>
            <div id="trace-list-container"></div>
        </section>

        <!-- Chat input at the very bottom -->
        <section id="input-panel">
            <textarea id="chat-input" placeholder="Type a message..."></textarea>
            <button id="send-btn" class="primary-button">Send</button>
        </section>
    </main>
</div>

<!-- New Project Modal -->
<div id="new-project-modal" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <h2>New Project</h2>
        <div class="form-field">
            <label for="project-name-input">Project Name</label>
            <input type="text" id="project-name-input" autocomplete="off" placeholder="my-project">
        </div>
        <div class="form-field">
            <label for="project-dir-input">Project Directory</label>
            <div class="dir-row">
                <input type="text" id="project-dir-input" autocomplete="off" placeholder="/path/to/project">
                <button id="choose-directory-btn" class="secondary-button">Choose</button>
            </div>
            <input type="file" id="project-directory-picker" webkitdirectory directory multiple hidden>
        </div>
        <div class="form-field">
            <label for="new-project-trace-level">Trace Level</label>
            <select id="new-project-trace-level">
                <option value="DEBUG">DEBUG</option>
                <option value="INFO" selected>INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
            </select>
        </div>
        <div class="modal-actions">
            <button id="cancel-project-btn" class="secondary-button">Cancel</button>
            <button id="create-project-btn" class="primary-button">Create</button>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
